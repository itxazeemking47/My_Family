<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Love Portal | Only for My Dear Wifey 😘</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;500;600;700;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"

<style>

:root {
    --gold: #d4af37;
    --gold-light: #fcf6ba;
    --gold-dark: #aa771c;
    --gold-glow: rgba(212, 175, 55, 0.5);

    --deep-pink: #ff1493;
    --magenta: #ff00ff;

    --velvet-black: #05050a;
    --glass: rgba(15, 15, 25, 0.78);

    --white: #ffffff;
    --soft-white: #f8f8f8;
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(212, 175, 55, 0.13),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(255, 0, 255, 0.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 20, 147, 0.04),
            transparent 45%
        ),
        #05050a;

    color: var(--white);
    font-family: "Quicksand", sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

/* =========================================================
   AMBIENT GLOW
========================================================= */

.ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.ambient::before,
.ambient::after {
    content: "";
    position: absolute;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    filter: blur(90px);

    animation: ambientPulse 7s ease-in-out infinite alternate;
}

.ambient::before {
    left: -180px;
    top: -120px;

    background: rgba(212, 175, 55, 0.12);
}

.ambient::after {
    right: -180px;
    bottom: -120px;

    background: rgba(255, 0, 255, 0.12);

    animation-delay: 2s;
}

@keyframes ambientPulse {
    from {
        opacity: 0.35;
        transform: scale(0.95);
    }

    to {
        opacity: 0.75;
        transform: scale(1.1);
    }
}

/* =========================================================
   PARTICLE CANVAS
========================================================= */

#particles {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
    pointer-events: none;
}

/* =========================================================
   MAIN WRAPPER
========================================================= */

.page {
    position: relative;
    z-index: 5;

    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 15px;
}

/* =========================================================
   LOGIN CARD
========================================================= */

.login-card {

    width: min(420px, 92vw);

    padding: 38px 30px 28px;

    background:
        linear-gradient(
            145deg,
            rgba(24, 24, 34, 0.90),
            rgba(8, 8, 15, 0.90)
        );

    border: 1px solid rgba(212, 175, 55, 0.48);

    border-radius: 26px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 0 0 1px rgba(255,255,255,0.025),
        0 0 30px rgba(212, 175, 55, 0.15),
        0 25px 80px rgba(0, 0, 0, 0.65);

    text-align: center;

    animation: cardAppear 1.1s ease forwards;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================================================
   HEART
========================================================= */

.main-heart {

    width: 78px;
    height: 78px;

    margin: 0 auto 16px;

    display: flex;
    justify-content: center;
    align-items: center;

    color: var(--gold-light);

    font-size: 42px;

    filter:
        drop-shadow(0 0 8px rgba(212,175,55,0.8))
        drop-shadow(0 0 22px rgba(212,175,55,0.35));

    animation: heartBeat 2.1s ease-in-out infinite;
}

@keyframes heartBeat {

    0%,
    100% {
        transform: scale(1);
    }

    14% {
        transform: scale(1.13);
    }

    28% {
        transform: scale(1);
    }

    42% {
        transform: scale(1.10);
    }

    70% {
        transform: scale(1);
    }
}

/* =========================================================
   HEADING
========================================================= */

.heading-small {

    font-family: "Cinzel Decorative", serif;

    font-size: clamp(1.2rem, 4vw, 1.55rem);

    font-weight: 700;

    letter-spacing: 1px;

    color: #ffffff;

    margin-bottom: 4px;
}

.heading-main {

    font-family: "Cinzel Decorative", serif;

    font-size: clamp(1.7rem, 7vw, 2.25rem);

    font-weight: 900;

    letter-spacing: 1px;

    background:
        linear-gradient(
            120deg,
            #fff8c9,
            #ffd76a,
            #d4af37,
            #fff3a8,
            #b8860b
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation: goldText 5s linear infinite;
}

@keyframes goldText {

    0% {
        background-position: 0% center;
    }

    50% {
        background-position: 100% center;
    }

    100% {
        background-position: 0% center;
    }
}

/* =========================================================
   MESSAGE
========================================================= */

.message {

    margin: 18px auto 22px;

    max-width: 300px;

    font-size: 0.92rem;

    line-height: 1.75;

    color: rgba(255,255,255,0.82);
}

.message strong {
    color: #fff;
}

.message .sparkle {
    color: #ffd86a;
}

/* =========================================================
   FORM
========================================================= */

.form-group {

    position: relative;

    margin-bottom: 14px;
}

.form-group input {

    width: 100%;

    height: 54px;

    padding: 0 48px 0 18px;

    border-radius: 14px;

    border: 1px solid rgba(212,175,55,0.42);

    outline: none;

    background:
        rgba(255,255,255,0.055);

    color: #ffffff;

    font-family: "Quicksand", sans-serif;

    font-size: 0.96rem;

    transition: 0.3s ease;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,0.18);
}

.form-group input::placeholder {
    color: rgba(255,255,255,0.48);
}

.form-group input:focus {

    border-color: var(--gold);

    background:
        rgba(255,255,255,0.075);

    box-shadow:
        0 0 0 3px rgba(212,175,55,0.08),
        0 0 22px rgba(212,175,55,0.14);
}

/* Password Show Button */

.show-password {

    position: absolute;

    right: 15px;
    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: rgba(255,255,255,0.55);

    cursor: pointer;

    font-size: 0.85rem;

    transition: 0.2s ease;
}

.show-password:hover {
    color: var(--gold-light);
}

/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {

    position: relative;

    width: 100%;

    min-height: 60px;

    margin-top: 10px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    overflow: hidden;

    color: #17120a;

    font-family: "Cinzel Decorative", serif;

    font-size: 0.85rem;

    font-weight: 900;

    letter-spacing: 1.5px;

    background:
        linear-gradient(
            110deg,
            #d4af37,
            #fff2a6,
            #f9d86c,
            #fff6bd,
            #c99b24
        );

    background-size: 300% 100%;

    box-shadow:
        0 8px 25px rgba(212,175,55,0.25),
        inset 0 1px 0 rgba(255,255,255,0.7);

    animation: goldShine 4s linear infinite;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.login-button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 30px rgba(212,175,55,0.4),
        0 0 25px rgba(212,175,55,0.16);
}

.login-button:active {
    transform: scale(0.98);
}

@keyframes goldShine {

    0% {
        background-position: 0% center;
    }

    50% {
        background-position: 100% center;
    }

    100% {
        background-position: 0% center;
    }
}

.login-button .lock {
    margin-left: 8px;
    font-size: 1rem;
}

/* =========================================================
   ERROR
========================================================= */

.error-message {

    min-height: 22px;

    margin-top: 12px;

    color: #ff6fae;

    font-size: 0.84rem;

    font-weight: 600;

    opacity: 0;

    transition: opacity 0.3s ease;
}

.error-message.show {
    opacity: 1;
}

/* =========================================================
   FOOTER MESSAGE
========================================================= */

.bottom-message {

    margin-top: 18px;

    color: rgba(255,255,255,0.66);

    font-size: 0.78rem;

    line-height: 1.7;
}

.bottom-message .heart {
    color: #ff315f;
}

/* =========================================================
   COPYRIGHT
========================================================= */

.copyright {

    margin-top: 25px;

    color: rgba(255,255,255,0.30);

    font-size: 0.59rem;

    letter-spacing: 3px;

    text-transform: uppercase;
}

/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-heart {

    position: fixed;

    bottom: -60px;

    left: 50%;

    z-index: 3;

    pointer-events: none;

    color: rgba(255,20,147,0.5);

    font-size: 20px;

    animation: floatHeart 7s linear forwards;
}

@keyframes floatHeart {

    0% {
        opacity: 0;
        transform: translateY(0) scale(0.5) rotate(0deg);
    }

    15% {
        opacity: 0.8;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-110vh)
            translateX(var(--move))
            scale(1.4)
            rotate(25deg);
    }
}

/* =========================================================
   SHAKE
========================================================= */

.shake {
    animation: shake 0.45s ease;
}

@keyframes shake {

    0%,
    100% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-10px);
    }

    40% {
        transform: translateX(10px);
    }

    60% {
        transform: translateX(-7px);
    }

    80% {
        transform: translateX(7px);
    }
}

/* =========================================================
   SUCCESS OVERLAY
========================================================= */

.success-overlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            rgba(255,20,147,0.12),
            rgba(0,0,0,0.96) 65%
        );

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
}

.success-overlay.show {

    opacity: 1;
    visibility: visible;
}

.success-box {

    text-align: center;

    transform: scale(0.75);

    transition: transform 0.7s cubic-bezier(.17,.67,.22,1.25);
}

.success-overlay.show .success-box {
    transform: scale(1);
}

.success-heart {

    font-size: 92px;

    color: #ff4d88;

    filter:
        drop-shadow(0 0 12px rgba(255,20,147,0.9))
        drop-shadow(0 0 40px rgba(255,20,147,0.5));

    animation: successBeat 1.2s ease-in-out infinite;
}

@keyframes successBeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

.success-title {

    margin-top: 20px;

    font-family: "Cinzel Decorative", serif;

    font-size: clamp(1.5rem, 6vw, 2.4rem);

    font-weight: 900;

    color: #fff;

    text-shadow:
        0 0 15px rgba(255,255,255,0.2),
        0 0 30px rgba(255,20,147,0.25);
}

.success-subtitle {

    margin-top: 12px;

    color: rgba(255,255,255,0.78);

    font-size: 1rem;

    line-height: 1.7;
}

.success-user {

    margin-top: 12px;

    color: var(--gold-light);

    font-weight: 700;

    letter-spacing: 1px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .page {
        padding: 20px 12px;
    }

    .login-card {
        padding: 32px 22px 25px;
        border-radius: 22px;
    }

    .main-heart {
        width: 65px;
        height: 65px;
        font-size: 35px;
    }

    .message {
        font-size: 0.86rem;
    }

    .form-group input {
        height: 52px;
    }

    .login-button {
        min-height: 58px;
    }

    .copyright {
        letter-spacing: 2px;
    }
}

</style>

<div class="ambient"></div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

/*
    IMPORTANT:
    Replace only the text inside the quotes with your
    actual Pushbullet Access Token.
*/

const PUSHBULLET_ACCESS_TOKEN =
    "YOUR_PUSHBULLET_TOKEN_HERE";


/* =========================================================
   LOGIN USERS
========================================================= */

const USERS = {

    "noorazeem": "azeemkinoor",

    "azeem": "azeemkinoor"

};


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById("loginForm");

const loginCard =
    document.getElementById("loginCard");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const errorMessage =
    document.getElementById("errorMessage");

const successOverlay =
    document.getElementById("successOverlay");

const successUser =
    document.getElementById("successUser");

const loginButton =
    document.getElementById("loginButton");


/* =========================================================
   SHOW / HIDE PASSWORD
========================================================= */

showPassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        showPassword.textContent = "Hide";

    } else {

        passwordInput.type = "password";

        showPassword.textContent = "Show";

    }

});


/* =========================================================
   ERROR FUNCTION
========================================================= */

function showError(message) {

    errorMessage.textContent = message;

    errorMessage.classList.add("show");

    loginCard.classList.remove("shake");

    void loginCard.offsetWidth;

    loginCard.classList.add("shake");

}


/* =========================================================
   PUSHBULLET NOTIFICATION
========================================================= */

async function sendPushbulletNotification(username) {

    /*
        If token is still placeholder,
        don't stop the login process.
    */

    if (
        !PUSHBULLET_ACCESS_TOKEN ||
        PUSHBULLET_ACCESS_TOKEN === "o.THMoBXG8Bbg0iSQrcVocjhw66E3axHN7"
    ) {

        console.warn(
            "Pushbullet token is not configured."
        );

        return false;
    }

    const now = new Date();

    const currentDateTime =
        now.toLocaleString(
            "en-PK",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    const notificationBody =
        username +
        " has accessed the portal at " +
        currentDateTime +
        ".";

    try {

        const response = await fetch(
            "https://api.pushbullet.com/v2/pushes",
            {
                method: "POST",

                headers: {
                    "Access-Token":
                        PUSHBULLET_ACCESS_TOKEN,

                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    type: "note",

                    title:
                        "Website Login Alert",

                    body:
                        notificationBody

                })
            }
        );

        if (!response.ok) {

            console.error(
                "Pushbullet error:",
                response.status
            );

            return false;
        }

        console.log(
            "Pushbullet notification sent."
        );

        return true;

    } catch (error) {

        console.error(
            "Pushbullet request failed:",
            error
        );

        return false;
    }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        errorMessage.classList.remove("show");

        const username =
            usernameInput.value.trim().toLowerCase();

        const password =
            passwordInput.value;

        /* Check username */

        if (!USERS[username]) {

            showError(
                "Ap kon ho....🤨"
            );

            return;
        }

        /* Check password */

        if (USERS[username] !== password) {

            showError(
                "Password ghalat hai... ❤️"
            );

            passwordInput.value = "";

            return;
        }


        /* =================================================
           SUCCESSFUL LOGIN
        ================================================= */

        loginButton.disabled = true;

        loginButton.style.opacity = "0.7";

        loginButton.innerHTML =
            "LOADING<br>OUR LOVE ❤️";


        /* Save login session */

        sessionStorage.setItem(
            "accessGranted",
            "true"
        );

        sessionStorage.setItem(
            "isLoggedIn",
            "true"
        );

        sessionStorage.setItem(
            "loggedInUser",
            username
        );


        /* Show success */

        successUser.textContent =
            "Welcome, " +
            username +
            " ❤️";

        successOverlay.classList.add("show");


        /*
            Send notification before redirect.
            If Pushbullet fails, the user still gets
            access to the portal.
        */

        await sendPushbulletNotification(username);


        /* Redirect */

        setTimeout(function () {

            window.location.href =
                "voicemail.html";

        }, 3500);

    }
);


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let particles = [];

const particleColors = [
    "#d4af37",
    "#ffffff",
    "#ff1493",
    "#ff00ff",
    "#ffd700"
];


function resizeCanvas() {

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );
}


function createParticles() {

    particles = [];

    const count =
        Math.min(
            140,
            Math.max(
                65,
                Math.floor(
                    window.innerWidth *
                    window.innerHeight /
                    10000
                )
            )
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        particles.push({

            x:
                Math.random() *
                window.innerWidth,

            y:
                Math.random() *
                window.innerHeight,

            radius:
                Math.random() *
                1.5 + 0.35,

            speed:
                Math.random() *
                0.35 + 0.08,

            drift:
                (Math.random() - 0.5) *
                0.25,

            alpha:
                Math.random() *
                0.75 + 0.15,

            color:
                particleColors[
                    Math.floor(
                        Math.random() *
                        particleColors.length
                    )
                ]

        });

    }
}


function animateParticles() {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    particles.forEach(function (p) {

        p.y -= p.speed;

        p.x += p.drift;

        if (p.y < -10) {

            p.y =
                window.innerHeight + 10;

            p.x =
                Math.random() *
                window.innerWidth;
        }

        if (p.x < -10) {
            p.x =
                window.innerWidth + 10;
        }

        if (p.x > window.innerWidth + 10) {
            p.x = -10;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.globalAlpha =
            p.alpha;

        ctx.fillStyle =
            p.color;

        ctx.fill();

    });

    ctx.globalAlpha = 1;

    requestAnimationFrame(
        animateParticles
    );
}


resizeCanvas();

createParticles();

animateParticles();


window.addEventListener(
    "resize",
    function () {

        resizeCanvas();

        createParticles();

    }
);


/* =========================================================
   FLOATING HEARTS
========================================================= */

function createFloatingHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.innerHTML =
        Math.random() > 0.5
            ? "❤️"
            : "♥";

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.fontSize =
        Math.random() * 15 + 12 + "px";

    heart.style.setProperty(
        "--move",
        (Math.random() * 180 - 90) + "px"
    );

    heart.style.animationDuration =
        (Math.random() * 3 + 6) + "s";

    document.body.appendChild(heart);

    setTimeout(function () {

        heart.remove();

    }, 10000);

}


/* Create hearts periodically */

setInterval(
    createFloatingHeart,
    2600
);


/* =========================================================
   CURSOR SPARKLE
========================================================= */

document.addEventListener(
    "mousemove",
    function (event) {

        if (Math.random() > 0.88) {

            const sparkle =
                document.createElement("span");

            sparkle.style.position =
                "fixed";

            sparkle.style.left =
                event.clientX + "px";

            sparkle.style.top =
                event.clientY + "px";

            sparkle.style.width =
                "3px";

            sparkle.style.height =
                "3px";

            sparkle.style.borderRadius =
                "50%";

            sparkle.style.background =
                Math.random() > 0.5
                    ? "#ffd700"
                    : "#ff4d88";

            sparkle.style.pointerEvents =
                "none";

            sparkle.style.zIndex =
                "9998";

            sparkle.style.boxShadow =
                "0 0 8px currentColor";

            document.body.appendChild(
                sparkle
            );

            sparkle.animate(

                [
                    {
                        opacity: 1,
                        transform:
                            "scale(1) translateY(0)"
                    },

                    {
                        opacity: 0,
                        transform:
                            "scale(0) translateY(-12px)"
                    }
                ],

                {
                    duration: 650,
                    easing: "ease-out"
                }

            ).onfinish = function () {

                sparkle.remove();

            };

        }

    }
);


/* =========================================================
   ENTER KEY FRIENDLY
========================================================= */

usernameInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            passwordInput.focus();

        }

    }
);
