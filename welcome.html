<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shahi Dehleez 👑 — Password Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a843;
            --gold-light: #f0d27a;
            --rose: #e84393;
            --rose-light: #fd79a8;
            --violet: #a855f7;
            --violet-light: #c084fc;
            --crimson: #ff2d55;
            --bg-dark: #05050a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 168, 67, 0.15);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', 'Quicksand', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* ── Ambient Background Glows ── */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .glow-gold {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            top: -10%; left: -5%;
            animation: floatGlow1 12s ease-in-out infinite;
        }
        .glow-rose {
            width: 450px; height: 450px;
            background: radial-gradient(circle, var(--rose) 0%, transparent 70%);
            bottom: -10%; right: -5%;
            animation: floatGlow2 14s ease-in-out infinite;
        }
        .glow-violet {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--violet) 0%, transparent 70%);
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation: floatGlow3 16s ease-in-out infinite;
        }
        .glow-gold-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, var(--gold-light) 0%, transparent 70%);
            bottom: 10%; left: 15%;
            animation: floatGlow4 10s ease-in-out infinite;
            opacity: 0.12;
        }

        @keyframes floatGlow1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, 40px) scale(1.15); }
            66% { transform: translate(-30px, 70px) scale(0.9); }
        }
        @keyframes floatGlow2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-50px, -60px) scale(1.1); }
            66% { transform: translate(40px, -30px) scale(0.95); }
        }
        @keyframes floatGlow3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-40%, -60%) scale(1.2); }
        }
        @keyframes floatGlow4 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.15); }
        }

        /* ── Particle Canvas ── */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ── Sparkle Trail Container ── */
        .sparkle-trail {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: sparkleFade 0.8s ease-out forwards;
        }
        @keyframes sparkleFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.1) translateY(-20px); }
        }

        /* ── Floating Hearts ── */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            animation: heartFloat linear forwards;
            opacity: 0;
        }
        @keyframes heartFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.2) rotate(45deg); }
        }

        /* ── Click Pop Emoji ── */
        .click-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 24px;
            animation: emojiPop 1s ease-out forwards;
        }
        @keyframes emojiPop {
            0% { opacity: 1; transform: scale(0.3) translateY(0); }
            50% { opacity: 1; transform: scale(1.2) translateY(-30px); }
            100% { opacity: 0; transform: scale(0.5) translateY(-80px); }
        }

        /* ── Main Centered Layout ── */
        .page-center {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── Glass Card ── */
        .glass-card {
            position: relative;
            width: 100%;
            max-width: 460px;
            padding: 50px 40px 45px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow:
                0 0 60px rgba(212, 168, 67, 0.06),
                0 0 120px rgba(232, 67, 147, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                inset 0 0 40px rgba(212, 168, 67, 0.03);
            animation: cardAppear 1s ease-out;
        }
        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Shifting Gold Border Overlay */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            right: -1px; bottom: -1px;
            border-radius: 29px;
            background: linear-gradient(
                var(--border-angle, 0deg),
                transparent 30%,
                var(--gold) 50%,
                transparent 70%
            );
            z-index: -1;
            opacity: 0.3;
            animation: rotateBorder 6s linear infinite;
        }
        @keyframes rotateBorder {
            0% { --border-angle: 0deg; }
            100% { --border-angle: 360deg; }
        }
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* Inner soft glow pulse */
        .glass-card::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 80%; height: 80%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 168, 67, 0.04) 0%, transparent 70%);
            animation: innerGlow 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes innerGlow {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        .glass-card > * {
            position: relative;
            z-index: 1;
        }

        /* ── Crown ── */
        .crown {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
            animation: crownFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 168, 67, 0.5));
        }
        @keyframes crownFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ── Headings ── */
        .card-heading {
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), #c49322, var(--gold-light));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s ease-in-out infinite;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        @keyframes shimmerText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .card-subheading {
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 1.35rem;
            color: var(--rose-light);
            margin-bottom: 8px;
            opacity: 0.9;
            text-shadow: 0 0 20px rgba(232, 67, 147, 0.3);
        }

        .card-description {
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            margin-bottom: 30px;
            padding: 0 5px;
        }

        /* ── Input Container ── */
        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        .password-input {
            width: 100%;
            padding: 16px 52px 16px 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(212, 168, 67, 0.15);
            border-radius: 14px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -webkit-appearance: none;
        }
        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
            font-size: 0.85rem;
        }
        .password-input:focus {
            border-color: var(--gold);
            box-shadow:
                0 0 20px rgba(212, 168, 67, 0.15),
                0 0 40px rgba(212, 168, 67, 0.05),
                inset 0 0 20px rgba(212, 168, 67, 0.03);
            background: rgba(255, 255, 255, 0.06);
        }
        .password-input:focus-visible {
            outline: none;
        }

        /* Eye Toggle */
        .eye-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: all 0.3s ease;
            line-height: 1;
        }
        .eye-toggle:hover {
            color: var(--gold);
            transform: translateY(-50%) scale(1.1);
        }

        /* ── Error Message ── */
        .error-message {
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--crimson);
            margin-bottom: 14px;
            min-height: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-shadow: 0 0 15px rgba(255, 45, 85, 0.4);
            line-height: 1.5;
        }
        .error-message.show {
            min-height: 20px;
            max-height: 60px;
            opacity: 1;
            margin-bottom: 14px;
            padding: 4px 0;
        }

        /* ── Submit Button ── */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px 30px;
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #0a0a0f;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), #c49322);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow:
                0 4px 20px rgba(212, 168, 67, 0.25),
                0 0 40px rgba(212, 168, 67, 0.08);
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 8px 30px rgba(212, 168, 67, 0.35),
                0 0 60px rgba(212, 168, 67, 0.12);
            background-position: 100% 50%;
        }
        .submit-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* Micro-shimmer on button */
        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transform: skewX(-20deg);
            animation: btnShimmer 3.5s ease-in-out infinite;
        }
        @keyframes btnShimmer {
            0%, 100% { left: -60%; }
            50% { left: 120%; }
        }

        /* ── Footer tagline ── */
        .footer-line {
            text-align: center;
            margin-top: 24px;
            font-family: 'Great Vibes', cursive;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }

        /* ── Success overlay ── */
        .success-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: var(--bg-dark);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .success-overlay .success-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: successPulse 1s ease-in-out infinite;
        }
        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .success-overlay .success-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: var(--gold-light);
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.4);
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .glass-card {
                padding: 40px 24px 35px;
                border-radius: 22px;
            }
            .card-heading { font-size: 1.4rem; }
            .card-subheading { font-size: 1.15rem; }
            .crown { font-size: 42px; }
            .password-input { padding: 14px 48px 14px 16px; font-size: 0.9rem; }
            .submit-btn { padding: 14px 24px; font-size: 0.85rem; }
        }

        /* Shake animation for wrong password */
        @keyframes shakeCard {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shakeCard 0.6s ease-in-out;
        }

        /* Loading dots for submit */
        .loading-dots span {
            animation: loadDot 1.4s infinite;
            opacity: 0;
        }
        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes loadDot {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Ambient Glows -->
    <div class="ambient-glow glow-gold"></div>
    <div class="ambient-glow glow-rose"></div>
    <div class="ambient-glow glow-violet"></div>
    <div class="ambient-glow glow-gold-2"></div>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-icon">💖</div>
        <div class="success-text">Khush Aamdeed... 🌹</div>
    </div>

    <!-- Main Content -->
    <div class="page-center">
        <div class="glass-card" id="glassCard">
            <div class="crown">👑</div>
            <h1 class="card-heading">Shahi Dehleez</h1>
            <p class="card-subheading">Kon ho ap...?</p>
            <p class="card-description">
                Yeh raaz ka darwaza hai — sirf ek khaas chehra pehle se muqarrar hai.<br>
                Apna raaz daakhil karein, aur is gehrai mein dakhil hon... ✨
            </p>

            <div class="input-wrapper">
                <input
                    type="password"
                    id="passwordInput"
                    class="password-input"
                    placeholder="Raaz likhein..."
                    autocomplete="off"
                    spellcheck="false"
                />
                <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Toggle password visibility">
                    <span id="eyeIcon">👁️</span>
                </button>
            </div>

            <div class="error-message" id="errorMessage">
                Galat Password! Sirf humari favourite person ko hi ijazat hai... 💔
            </div>

            <button type="button" class="submit-btn" id="submitBtn" onclick="validatePassword()">
                Dakhil Hon
            </button>

            <p class="footer-line">— Mehboob ki duniya ka darwaza —</p>
        </div>
    </div>

    <script>
        /* ══════════════════════════════════════════════
           Security: Disable DevTools shortcuts & Right-click
        ══════════════════════════════════════════════ */
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) ||
                (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
                (e.ctrlKey && (e.key === 'S' || e.key === 's'))) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        /* ══════════════════════════════════════════════
           Password Authorization Logic
        ══════════════════════════════════════════════ */
        const CORRECT_PASSWORD = "azeemkinoor";

        function validatePassword() {
            const input = document.getElementById('passwordInput');
            const errorMsg = document.getElementById('errorMessage');
            const card = document.getElementById('glassCard');
            const btn = document.getElementById('submitBtn');
            const value = input.value.trim();

            if (!value) {
                errorMsg.innerHTML = 'Pehle raaz toh likhein... ✍️';
                errorMsg.classList.add('show');
                shakeTheCard();
                return;
            }

            if (value === CORRECT_PASSWORD) {
                // Success
                errorMsg.classList.remove('show');
                btn.innerHTML = '<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';
                btn.style.pointerEvents = 'none';

                sessionStorage.setItem("accessGranted", "true");

                setTimeout(function() {
                    document.getElementById('successOverlay').classList.add('active');
                }, 500);

                setTimeout(function() {
                    window.location.replace("welcome.html");
                }, 2200);
            } else {
                // Failure
                errorMsg.innerHTML = 'Galat Password! Sirf humari favourite person ko hi ijazat hai... 💔';
                errorMsg.classList.add('show');
                shakeTheCard();
                input.value = '';
                input.focus();
            }
        }

        function shakeTheCard() {
            const card = document.getElementById('glassCard');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 700);
        }

        // Enter key to submit
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                validatePassword();
            }
        });

        // Eye toggle
        const eyeToggle = document.getElementById('eyeToggle');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        let eyeOpen = false;

        eyeToggle.addEventListener('click', function() {
            eyeOpen = !eyeOpen;
            passwordInput.type = eyeOpen ? 'text' : 'password';
            eyeIcon.textContent = eyeOpen ? '🙈' : '👁️';
        });

        /* ══════════════════════════════════════════════
           Particle System — Gold, Rose, Violet
        ══════════════════════════════════════════════ */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 80;
        const particleColors = [
            'rgba(212, 168, 67, ',
            'rgba(240, 210, 122, ',
            'rgba(232, 67, 147, ',
            'rgba(253, 121, 168, ',
            'rgba(168, 85, 247, ',
            'rgba(192, 132, 252, '
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.colorBase = particleColors[Math.floor(Math.random() * particleColors.length)];
                this.opacity = Math.random() * 0.5 + 0.15;
                this.opacityDir = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity += this.opacityDir * 0.002;
                if (this.opacity >= 0.7) this.opacityDir = -1;
                if (this.opacity <= 0.1) this.opacityDir = 1;

                if (this.x < -10 || this.x > canvas.width + 10 ||
                    this.y < -10 || this.y > canvas.height + 10) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.colorBase + this.opacity + ')';
                ctx.fill();

                // Subtle glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = this.colorBase + (this.opacity * 0.15) + ')';
                ctx.fill();
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* ══════════════════════════════════════════════
           Sparkle Cursor Trail
        ══════════════════════════════════════════════ */
        const sparkleColors = ['#d4a843', '#f0d27a', '#e84393', '#fd79a8', '#a855f7', '#c084fc', '#fff'];
        let sparkleThrottle = 0;

        document.addEventListener('mousemove', function(e) {
            sparkleThrottle++;
            if (sparkleThrottle % 3 !== 0) return;

            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle-trail');
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            sparkle.style.background = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
            sparkle.style.boxShadow = '0 0 6px ' + sparkle.style.background;
            const size = Math.random() * 5 + 3;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            document.body.appendChild(sparkle);

            setTimeout(() => sparkle.remove(), 800);
        });

        /* ══════════════════════════════════════════════
           Click / Touch Emoji Pop
        ══════════════════════════════════════════════ */
        const popEmojis = ['💖', '✨', '🌹', '💫', '🦋', '💗', '👑', '🔥', '💜', '🌺', '💕', '⭐'];

        document.addEventListener('click', function(e) {
            // Don't pop if clicking interactive elements
            if (e.target.closest('.submit-btn') || e.target.closest('.eye-toggle') || e.target.closest('.password-input')) return;

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.classList.add('click-emoji');
                    emoji.textContent = popEmojis[Math.floor(Math.random() * popEmojis.length)];
                    emoji.style.left = (e.clientX + (Math.random() - 0.5) * 40) + 'px';
                    emoji.style.top = (e.clientY + (Math.random() - 0.5) * 20) + 'px';
                    document.body.appendChild(emoji);
                    setTimeout(() => emoji.remove(), 1000);
                }, i * 100);
            }
        });

        document.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            if (e.target.closest('.submit-btn') || e.target.closest('.eye-toggle') || e.target.closest('.password-input')) return;

            for (let i = 0; i < 2; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.classList.add('click-emoji');
                    emoji.textContent = popEmojis[Math.floor(Math.random() * popEmojis.length)];
                    emoji.style.left = (touch.clientX + (Math.random() - 0.5) * 30) + 'px';
                    emoji.style.top = (touch.clientY + (Math.random() - 0.5) * 15) + 'px';
                    document.body.appendChild(emoji);
                    setTimeout(() => emoji.remove(), 1000);
                }, i * 80);
            }
        }, { passive: true });

        /* ══════════════════════════════════════════════
           Floating Hearts Generator
        ══════════════════════════════════════════════ */
        const heartChars = ['♥', '♡', '❤', '💕', '💖'];
        const heartColors = ['#d4a843', '#e84393', '#fd79a8', '#a855f7', '#c084fc', '#ff6b81'];

        function spawnFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-30px';
            heart.style.fontSize = (Math.random() * 18 + 12) + 'px';
            heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
            heart.style.textShadow = '0 0 10px currentColor';
            const duration = Math.random() * 8 + 8;
            heart.style.animationDuration = duration + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }

        // Spawn hearts periodically
        setInterval(spawnFloatingHeart, 2000);
        // Initial burst
        setTimeout(spawnFloatingHeart, 500);
        setTimeout(spawnFloatingHeart, 1000);
        setTimeout(spawnFloatingHeart, 1500);

        /* ══════════════════════════════════════════════
           Auto-focus the password input
        ══════════════════════════════════════════════ */
        window.addEventListener('load', function() {
            setTimeout(() => document.getElementById('passwordInput').focus(), 300);
        });
    </script>
</body>
</html>
