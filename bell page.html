<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Queen Noor 👑🌸</title>

    <!-- SECURITY CHECK — SAME LOGIC -->
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("index.html");
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #ff7eb6;
            --deep-pink: #ec4899;
            --purple: #a78bfa;
            --lavender: #c4b5fd;
            --cream: #fff8fc;
            --text: #5d4057;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Quicksand', sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.95), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(255,182,219,.55), transparent 30%),
                linear-gradient(135deg, #fff1f7, #f5edff, #ffe8f2);

            color: var(--text);
        }

        /* Soft background glow */

        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: rgba(255,126,182,.18);
            filter: blur(80px);

            top: -200px;
            left: -150px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;

            background: rgba(167,139,250,.18);
            filter: blur(80px);

            bottom: -180px;
            right: -150px;
        }

        /* Floating petals / emojis */

        .emoji-rain {
            position: absolute;
            top: -60px;

            pointer-events: none;
            user-select: none;

            z-index: 1;

            animation: fall linear forwards;

            filter: drop-shadow(0 3px 5px rgba(236,72,153,.15));
        }

        @keyframes fall {

            0% {
                transform:
                    translateY(-60px)
                    rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(360deg);
                opacity: .85;
            }
        }

        /* Main Card */

        .garden-card {

            width: min(92%, 430px);

            padding: 38px 28px 32px;

            text-align: center;

            position: relative;
            z-index: 10;

            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.82),
                    rgba(255,240,249,.64)
                );

            border: 1px solid rgba(255,255,255,.9);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 25px 70px rgba(142,72,117,.18),
                inset 0 1px 0 rgba(255,255,255,.95);

            animation: cardAppear 1s ease forwards;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Decorative corners */

        .corner {
            position: absolute;
            font-size: 27px;
            opacity: .75;
        }

        .corner.top-left {
            top: 14px;
            left: 18px;
        }

        .corner.top-right {
            top: 14px;
            right: 18px;
        }

        .corner.bottom-left {
            bottom: 14px;
            left: 18px;
        }

        .corner.bottom-right {
            bottom: 14px;
            right: 18px;
        }

        /* Crown */

        .crown {
            font-size: 43px;

            display: inline-block;

            margin-bottom: 5px;

            filter:
                drop-shadow(0 5px 10px rgba(255,126,182,.35));

            animation: crownFloat 3s ease-in-out infinite;
        }

        @keyframes crownFloat {

            0%,100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-7px) rotate(3deg);
            }
        }

        /* Heading */

        h1 {

            font-family: 'DM Serif Display', serif;

            font-size: clamp(28px, 8vw, 38px);

            color: #7c496f;

            line-height: 1.15;

            margin-bottom: 5px;

            text-shadow:
                0 3px 15px rgba(236,72,153,.18);
        }

        .script-name {

            font-family: 'Great Vibes', cursive;

            font-size: 32px;

            color: var(--deep-pink);

            margin-bottom: 17px;
        }

        /* Message */

        .message {

            font-size: 15px;

            line-height: 1.8;

            font-weight: 600;

            color: #75576d;

            margin: 0 auto 25px;

            max-width: 330px;
        }

        .message span {
            color: var(--deep-pink);
        }

        /* Cute divider */

        .divider {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 22px;

            color: #e59abc;

            font-size: 14px;
        }

        .divider::before,
        .divider::after {

            content: "";

            width: 65px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #eab0ca,
                    transparent
                );
        }

        /* Alarm button */

        .crazy-alarm-btn {

            width: 100%;

            border: none;

            border-radius: 22px;

            padding: 17px 20px;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            font-family: 'Quicksand', sans-serif;

            font-size: 17px;

            font-weight: 700;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff80b5,
                    #ec6ba7,
                    #a78bfa
                );

            box-shadow:
                0 12px 28px rgba(236,72,153,.25),
                inset 0 1px 0 rgba(255,255,255,.45);

            transition: .25s ease;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .crazy-alarm-btn::before {

            content: "";

            position: absolute;

            width: 80px;
            height: 150%;

            background: rgba(255,255,255,.25);

            transform: rotate(25deg);

            left: -120px;
            top: -25px;

            transition: .7s;
        }

        .crazy-alarm-btn:hover::before {
            left: 120%;
        }

        .crazy-alarm-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 16px 35px rgba(236,72,153,.35);
        }

        .crazy-alarm-btn:active {
            transform: scale(.97);
        }

        .crazy-alarm-btn:disabled {

            cursor: default;
            opacity: .85;

            transform: none;
        }

        /* Little note */

        .little-note {

            margin-top: 18px;

            font-size: 12px;

            color: #a27b96;

            font-weight: 600;

            opacity: .85;
        }

        /* Status */

        #status-msg {

            margin-top: 17px;

            padding: 10px 14px;

            border-radius: 15px;

            font-size: 13px;

            font-weight: 700;

            display: none;

            background: rgba(255,255,255,.55);

            border: 1px solid rgba(255,255,255,.8);
        }

        /* Bottom signature */

        .signature {

            margin-top: 23px;

            font-family: 'Great Vibes', cursive;

            font-size: 20px;

            color: #c2789e;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .garden-card {
                padding: 34px 22px 28px;
            }

            h1 {
                font-size: 29px;
            }

            .script-name {
                font-size: 29px;
            }

            .message {
                font-size: 14px;
            }

            .crazy-alarm-btn {
                font-size: 16px;
                padding: 16px;
            }
        }

    </style>
</head>

<body oncontextmenu="return false;">

    <!-- Decorative corners -->

    <div class="garden-card">

        <div class="corner top-left">🌸</div>
        <div class="corner top-right">🦋</div>
        <div class="corner bottom-left">🌷</div>
        <div class="corner bottom-right">💗</div>

        <div class="crown">👑</div>

        <h1>Welcome, My Noor</h1>

        <div class="script-name">
            My Beautiful Queen 💕
        </div>

        <div class="message">
            کیا ہوا جاناں؟ 🤭<br>
            میں آف لائن ہوں کیا؟ 🙈<br><br>

            کوئی بات نہیں...
            بس <span>نیچے والا بٹن</span> دبا دو۔ 🌸
        </div>

        <div class="divider">
            ✦ 💕 ✦
        </div>

        <button class="crazy-alarm-btn" onclick="wakeUpAzeem()">
            <span>⏰</span>
            <span>Wake Up My Lazy Hubby!</span>
            <span>💥</span>
        </button>

        <div id="status-msg"></div>

        <div class="little-note">
            ایک چھوٹا سا الارم... صرف میرے عظیم کے لیے 🤭💕
        </div>

        <div class="signature">
            — From Your Noor 🌷
        </div>

    </div>


    <script>

        /* =========================================
           DISABLE INSPECT SHORTCUTS
        ========================================= */

        document.onkeydown = function(e) {

            if (
                e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 'I'.charCodeAt(0)) ||
                (e.ctrlKey && e.keyCode === 'U'.charCodeAt(0))
            ) {
                return false;
            }

        };


        /* =========================================
           EMOJI / FLOWER RAIN
        ========================================= */

        const emojis = [
            '🌸',
            '🌷',
            '🌹',
            '🌺',
            '🌼',
            '🪻',
            '🦋',
            '💗',
            '💕',
            '💖',
            '💘',
            '💝',
            '💞',
            '💓',
            '💌',
            '✨',
            '🤍',
            '🎀',
            '👑',
            '🥰',
            '😘'
        ];


        function createEmoji() {

            const emoji = document.createElement('div');

            emoji.classList.add('emoji-rain');

            emoji.innerText =
                emojis[Math.floor(Math.random() * emojis.length)];


            emoji.style.left =
                Math.random() * 100 + "vw";


            const duration =
                Math.random() * 2.5 + 2.5;

            emoji.style.animationDuration =
                duration + "s";


            emoji.style.fontSize =
                Math.random() * 12 + 18 + "px";


            document.body.appendChild(emoji);


            setTimeout(() => {

                emoji.remove();

            }, duration * 1000);

        }


        /*
            Soft rain instead of extremely heavy rain
            so the new feminine theme stays elegant.
        */

        setInterval(createEmoji, 180);


        /* =========================================
           WAKE UP AZEEM
        ========================================= */

        function wakeUpAzeem() {

            const statusDiv =
                document.getElementById('status-msg');

            const btn =
                document.querySelector('.crazy-alarm-btn');


            /* Mobile vibration */

            if (navigator.vibrate) {

                navigator.vibrate([
                    150,
                    100,
                    150
                ]);

            }


            /* Disable button */

            btn.disabled = true;

            btn.innerHTML =
                "🚨 Alarm Activated! 💕";


            statusDiv.style.color =
                "#ec4899";

            statusDiv.style.display =
                "block";

            statusDiv.innerText =
                "جگایا جا رہا ہے... 🚀💕";


            /* =========================================
               PUSHBULLET
            ========================================= */

            const apiKey =
                "o.THMoBXG8Bbg0iSQrcVocjhw66E3axHN7";


            const payload = {

                type: "note",

                title:
                    "🚨 NOOR IS ONLINE!! 🚨",

                body:
                    "اٹھو عظیم! تمہاری نور یاد کر رہی ہے۔ جلدی سے آن لائن آؤ! ❤️⏰"

            };


            fetch(
                'https://api.pushbullet.com/v2/pushes',
                {
                    method: 'POST',

                    headers: {

                        'Access-Token': apiKey,

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify(payload)

                }
            )

            .then(response => {

                if (response.ok) {

                    statusDiv.style.color =
                        "#22a06b";

                    statusDiv.innerText =
                        "میں نے عظیم کو جگا دیا ہے! 😘💕";

                }

                else {

                    statusDiv.style.color =
                        "#e05a70";

                    statusDiv.innerText =
                        "دوبارہ ٹرائی کریں۔ 💗";

                    resetButton(btn);

                }

            })

            .catch(error => {

                console.error(
                    "Pushbullet Error:",
                    error
                );

                statusDiv.style.color =
                    "#e05a70";

                statusDiv.innerText =
                    "انٹرنیٹ کا مسئلہ آرہا ہے۔ 🌸";

                resetButton(btn);

            });

        }


        /* =========================================
           RESET BUTTON
        ========================================= */

        function resetButton(btn) {

            setTimeout(() => {

                btn.disabled = false;

                btn.innerHTML =
                    "⏰ Wake Up My Lazy Hubby! 💥";

            }, 6000);

        }

    </script>

</body>
</html>
