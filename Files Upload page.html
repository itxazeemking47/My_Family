<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Portal - Upload Zone 🖼️</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Lexend', sans-serif;
        }
        body {
            background: #060608;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        /* بیک گراؤنڈ ڈیزائن ہوم پیج سے میچنگ */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at top, rgba(255,211,107,0.15), transparent 40%),
                radial-gradient(circle at bottom, rgba(255,77,136,0.1), transparent 40%),
                linear-gradient(180deg, rgba(6,6,8,0.4), rgba(6,6,8,0.9));
            z-index: -1;
        }
        .upload-container {
            background: rgba(255, 255, 255, 0.06);
            padding: 40px 30px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 460px;
            text-align: center;
        }
        h2 {
            color: #ffd36b;
            margin-bottom: 12px;
            font-size: 26px;
            text-shadow: 0 0 15px rgba(255,211,107,0.2);
        }
        p {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .file-box {
            border: 2px dashed #ff4d88;
            padding: 40px 20px;
            border-radius: 18px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.3s ease;
            background: rgba(255, 77, 136, 0.02);
        }
        .file-box:hover {
            background: rgba(255, 77, 136, 0.08);
            border-color: #ffd36b;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            cursor: pointer;
            display: block;
            color: #fffafc;
        }
        .file-label svg {
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .file-box:hover .file-label svg {
            transform: translateY(-5px);
            stroke: #ffd36b;
        }
        #fileInfo {
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .file-label span {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .btn-submit {
            background: linear-gradient(135deg, #ff4d88, #ec4899);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
            transition: 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(236, 72, 153, 0.5);
        }
        .btn-submit:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        #statusMessage {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
        }
        .loading-spinner {
            display: none;
            margin: 20px auto 0;
            border: 4px solid rgba(255,255,255,0.1);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border-left-color: #ff4d88;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }
        .back-link:hover {
            color: #ffd36b;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="upload-container">
    <h2>Share Your Moments 👑</h2>
    <p>Apni private pics ya videos select karke upload karein,<br>yeh seedha mere paas safe ho jayengi.</p>
    
    <form id="uploadForm">
        <div class="file-box" onclick="document.getElementById('fileInput').click()">
            <label class="file-label">
                <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="#ff4d88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <div id="fileInfo">Choose File</div>
                <span>Images or Videos (Max 35MB)</span>
            </label>
            <input type="file" id="fileInput" required>
        </div>
        
        <button type="submit" class="btn-submit" id="submitBtn">Upload to Portal ✨</button>
    </form>
    
    <div class="loading-spinner" id="spinner"></div>
    <div id="statusMessage"></div>
    
    <a href="javascript:history.back()" class="back-link">← Back to Portal</a>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const spinner = document.getElementById('spinner');

    // آپ کا فائنل لائیو گوگل اسکرپٹ لنک بغیر کسی تبدیلی کے یہاں سیٹ ہے
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOvx4JrLUMeYtSAiB-488Vh9cAbMKAOy2K9N8IwSCV-TKYlhsrTbx3FZ7UbJKGoQJgUQ/exec";

    fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) {
            fileInfo.textContent = fileInput.files[0].name;
            fileInfo.style.color = "#ffd36b";
        }
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const file = fileInput.files[0];
        if (!file) return;

        // فائل سائز لیمیٹیشن (35MB)
        if (file.size > 35 * 1024 * 1024) {
            statusMessage.textContent = "File bohat bari hai! Please 35MB se choti file select karein.";
            statusMessage.style.color = "#ff4d88";
            return;
        }

        submitBtn.disabled = true;
        spinner.style.display = "block";
        statusMessage.textContent = "Uploading... Please wait.";
        statusMessage.style.color = "rgba(255,255,255,0.6)";

        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = function() {
            const base64Data = reader.result.split(',')[1];
            
            const payload = {
                base64: base64Data,
                type: file.type,
                name: file.name
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                spinner.style.display = "none";
                submitBtn.disabled = false;
                
                if (data.status === "success") {
                    statusMessage.textContent = "Success! File mere paas pohnch gayi hai. ❤️";
                    statusMessage.style.color = "#ffd36b";
                    form.reset();
                    fileInfo.textContent = "Choose File";
                    fileInfo.style.color = "#fffafc";
                } else {
                    statusMessage.textContent = "Error: " + data.message;
                    statusMessage.style.color = "#ff4d88";
                }
            })
            .catch(err => {
                spinner.style.display = "none";
                submitBtn.disabled = false;
                statusMessage.textContent = "Upload kamyab nahi ho saka. Connection check karein.";
                statusMessage.style.color = "#ff4d88";
                console.error(err);
            });
        };
    });

    // رائٹ کلک اور انسپیکٹ ایلیمنٹ بلاک کرنے کے لیے
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    };
</script>

</body>
</html>
